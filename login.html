<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Sổ Từ Vựng</title>
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div class="airmail-rail"></div>
  <div class="auth-shell">

    <!-- Một khối phong bì duy nhất, dùng chung cho cả desktop và mobile.
         CSS (@media max-width:760px) sẽ tự đổi kích thước/tỉ lệ sang dạng đứng. -->
    <div class="envelope-outer">
      <div class="envelope-card">
        <div class="stamp-corner">
          <img class="stamp-img" alt="Tem thư">
          <div class="stamp-fallback">
            <div class="stamp-icon">✉</div>
            <div class="stamp-text">PAR<br>AVION</div>
          </div>
        </div>

        <!-- Kính gửi — vị trí/cỡ chữ chỉnh trong css/style.css (khác nhau cho desktop/mobile) -->
        <div class="recipient-block">
          <span class="addr-label">Kính gửi</span>
          <span class="recipient-value">Sổ Từ Vựng</span>
        </div>

        <!-- Người gửi — luôn nằm giữa lá thư. Đăng nhập không cần mật khẩu:
             chỉ cần email, bấm "Gửi thư" là Firebase gửi 1 email chứa link đăng nhập. -->
        <div class="address-block">

          <form class="authForm" id="sendForm">
            <div class="line from-line field">
              <label class="addr-label">Người gửi</label>
              <input type="email" class="f-email" placeholder="ten@email.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary btn-block js-submit">Gửi thư</button>
            <div class="error-msg js-error"></div>
          </form>

          <!-- Hiện sau khi đã gửi thư thành công -->
          <div id="sentState" style="display:none;">
            <p style="margin:0 0 14px;font-size:14.5px;color:var(--ink-soft);">
              Đã gửi thư đến <b id="sentEmail" style="color:var(--ink);"></b> —
              mở hộp thư và bấm vào link trong đó để vào Sổ Từ Vựng.
            </p>
            <button type="button" class="btn btn-block" id="resendBtn">Gửi lại thư khác</button>
          </div>

          <!-- Hiện khi bấm link xong nhưng thiếu email đã lưu (mở link ở máy/trình duyệt khác) -->
          <form id="confirmEmailForm" style="display:none;">
            <p style="margin:0 0 14px;font-size:14.5px;color:var(--ink-soft);">
              Để xác nhận, nhập lại đúng email bạn đã dùng để gửi thư:
            </p>
            <div class="line from-line field">
              <label class="addr-label">Người gửi</label>
              <input type="email" class="f-email" placeholder="ten@email.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary btn-block js-submit">Vào Sổ Từ Vựng</button>
            <div class="error-msg js-error"></div>
          </form>

        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, onAuthStateChanged, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink }
      from "./js/firebase-init.js";

    const STORAGE_KEY = "emailForSignIn";

    // ==== TEM NGẪU NHIÊN ====
    // Đặt ảnh vào assets/stamps/ với tên: stamp1.png, stamp2.png, stamp3.png ...
    // (đánh số liên tục, không có số 0 ở đầu). Thêm ảnh mới thì tăng STAMP_COUNT.
    const STAMP_COUNT = 15;
    const STAMP_FILES = Array.from({ length: STAMP_COUNT }, (_, i) => `assets/stamps/stamp${i + 1}.png`);
    const stampImg = document.querySelector(".stamp-img");
    const stampFallback = document.querySelector(".stamp-fallback");
    if (stampImg && STAMP_FILES.length) {
      stampImg.addEventListener("load", () => {
        stampImg.style.display = "block";
        if (stampFallback) stampFallback.style.display = "none";
      });
      stampImg.addEventListener("error", () => {
        stampImg.style.display = "none";
        if (stampFallback) stampFallback.style.display = "flex";
      });
      stampImg.src = STAMP_FILES[Math.floor(Math.random() * STAMP_FILES.length)];
    }

    const sendForm = document.getElementById("sendForm");
    const sentState = document.getElementById("sentState");
    const sentEmailEl = document.getElementById("sentEmail");
    const resendBtn = document.getElementById("resendBtn");
    const confirmEmailForm = document.getElementById("confirmEmailForm");

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    // Nếu URL hiện tại chính là link đăng nhập Firebase gửi qua email
    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = window.localStorage.getItem(STORAGE_KEY);
      if (email) {
        completeSignIn(email);
      } else {
        // Mở link ở máy/trình duyệt khác — không có sẵn email đã lưu, hỏi lại
        sendForm.style.display = "none";
        confirmEmailForm.style.display = "block";
      }
    }

    sendForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = sendForm.querySelector(".js-error");
      const submitBtn = sendForm.querySelector(".js-submit");
      const email = sendForm.querySelector(".f-email").value.trim();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      try {
        await sendLink(email);
        window.localStorage.setItem(STORAGE_KEY, email);
        sendForm.style.display = "none";
        sentEmailEl.textContent = email;
        sentState.style.display = "block";
      } catch (err) {
        errorEl.textContent = friendlyError(err.code);
      } finally {
        submitBtn.disabled = false;
      }
    });

    confirmEmailForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = confirmEmailForm.querySelector(".js-error");
      const submitBtn = confirmEmailForm.querySelector(".js-submit");
      const email = confirmEmailForm.querySelector(".f-email").value.trim();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      try {
        await completeSignIn(email);
      } catch (err) {
        errorEl.textContent = friendlyError(err.code);
        submitBtn.disabled = false;
      }
    });

    resendBtn.addEventListener("click", () => {
      sentState.style.display = "none";
      sendForm.style.display = "block";
      sendForm.querySelector(".f-email").value = "";
    });

    function sendLink(email) {
      const actionCodeSettings = {
        url: window.location.origin + window.location.pathname,
        handleCodeInApp: true
      };
      return sendSignInLinkToEmail(auth, email, actionCodeSettings);
    }

    async function completeSignIn(email) {
      await signInWithEmailLink(auth, email, window.location.href);
      window.localStorage.removeItem(STORAGE_KEY);
      window.location.href = "index.html";
    }

    function friendlyError(code) {
      const map = {
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/invalid-action-code": "Link đã được dùng hoặc không hợp lệ, gửi lại thư mới nhé.",
        "auth/expired-action-code": "Link đã hết hạn, gửi lại thư mới nhé."
      };
      return map[code] || "Có lỗi xảy ra, thử lại nhé.";
    }
  </script>
</body>
</html>
