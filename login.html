<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Từ Vựng</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="airmail-rail"></div>
  <div class="auth-shell">
    <div class="auth-card">
      <h1 id="formTitle">Đăng nhập</h1>
      <div class="sub">Sổ từ vựng của riêng bạn, đồng bộ ở mọi thiết bị.</div>

      <form id="authForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Đăng nhập</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="auth-toggle">
        <span id="toggleText">Chưa có tài khoản?</span>
        <button type="button" id="toggleBtn">Đăng ký</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword }
      from "./js/firebase-init.js";

    let mode = "login"; // hoặc "register"

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    const form = document.getElementById("authForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");
    const formTitle = document.getElementById("formTitle");
    const toggleText = document.getElementById("toggleText");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      if (mode === "register") {
        formTitle.textContent = "Tạo tài khoản";
        submitBtn.textContent = "Đăng ký";
        toggleText.textContent = "Đã có tài khoản?";
        toggleBtn.textContent = "Đăng nhập";
      } else {
        formTitle.textContent = "Đăng nhập";
        submitBtn.textContent = "Đăng nhập";
        toggleText.textContent = "Chưa có tài khoản?";
        toggleBtn.textContent = "Đăng ký";
      }
      errorMsg.textContent = "";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      submitBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        if (mode === "login") {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        window.location.href = "index.html";
      } catch (err) {
        errorMsg.textContent = friendlyError(err.code);
      } finally {
        submitBtn.disabled = false;
      }
    });

    function friendlyError(code) {
      const map = {
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/user-not-found": "Không tìm thấy tài khoản này.",
        "auth/wrong-password": "Sai mật khẩu.",
        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
        "auth/email-already-in-use": "Email này đã được đăng ký.",
        "auth/weak-password": "Mật khẩu cần ít nhất 6 ký tự."
      };
      return map[code] || "Có lỗi xảy ra, thử lại nhé.";
    }
  </script>
</body>
</html>
