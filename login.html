<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Sổ Từ Vựng</title>
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div class="airmail-rail"></div>
  <div class="auth-shell">

    <!-- Một khối phong bì duy nhất, dùng chung cho cả desktop và mobile.
         CSS (@media max-width:760px) sẽ tự đổi kích thước/tỉ lệ sang dạng đứng. -->
    <div class="envelope-outer">
      <div class="envelope-card">
        <div class="stamp-corner">
          <img class="stamp-img" alt="Tem thư">
          <div class="stamp-fallback">
            <div class="stamp-icon">✉</div>
            <div class="stamp-text">PAR<br>AVION</div>
          </div>
        </div>

        <!-- Kính gửi — vị trí/cỡ chữ chỉnh trong css/style.css (khác nhau cho desktop/mobile) -->
        <div class="recipient-block">
          <span class="addr-label">Kính gửi</span>
          <span class="recipient-value">Sổ Từ Vựng</span>
        </div>

        <!-- Người gửi + đăng nhập — luôn nằm giữa lá thư -->
        <div class="address-block">
          <form class="authForm">
            <div class="line from-line field">
              <label class="addr-label">Người gửi</label>
              <input type="email" class="f-email" placeholder="ten@email.com" required autocomplete="email">
            </div>
            <div class="field">
              <label>Địa chỉ</label>
              <input type="password" class="f-password" placeholder="Mật khẩu" required autocomplete="current-password" minlength="6">
            </div>
            <div class="field confirm-password-field" style="display:none;">
              <label>Xác nhận địa chỉ</label>
              <input type="password" class="f-password-confirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block js-submit">Gửi thư</button>
            <div class="error-msg js-error"></div>
          </form>

          <div class="auth-toggle">
            <span class="js-toggle-text">Chưa có tài khoản?</span>
            <button type="button" class="js-toggle-btn">Đăng ký</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword }
      from "./js/firebase-init.js";
    import { createUserProfile } from "./js/db.js";
    import { STAMP_FILES, randomStamp } from "./js/stamps.js";

    let mode = "login"; // hoặc "register"

    // ==== TEM TRANG TRÍ (ngẫu nhiên, chỉ để hiển thị trên phong bì) ====
    const stampImg = document.querySelector(".stamp-img");
    const stampFallback = document.querySelector(".stamp-fallback");
    if (stampImg && STAMP_FILES.length) {
      stampImg.addEventListener("load", () => {
        stampImg.style.display = "block";
        if (stampFallback) stampFallback.style.display = "none";
      });
      stampImg.addEventListener("error", () => {
        stampImg.style.display = "none";
        if (stampFallback) stampFallback.style.display = "flex";
      });
      stampImg.src = STAMP_FILES[Math.floor(Math.random() * STAMP_FILES.length)];
    }

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    const forms = document.querySelectorAll(".authForm");
    const submitBtns = document.querySelectorAll(".js-submit");
    const toggleTexts = document.querySelectorAll(".js-toggle-text");
    const toggleBtns = document.querySelectorAll(".js-toggle-btn");
    const errorEls = document.querySelectorAll(".js-error");

    function applyModeUI() {
      const isRegister = mode === "register";
      submitBtns.forEach(el => el.textContent = isRegister ? "Đăng ký" : "Đăng nhập");
      toggleTexts.forEach(el => el.textContent = isRegister ? "Đã có tài khoản?" : "Chưa có tài khoản?");
      toggleBtns.forEach(el => el.textContent = isRegister ? "Đăng nhập" : "Đăng ký");
      errorEls.forEach(el => el.textContent = "");
      document.querySelectorAll(".confirm-password-field").forEach(el => {
        el.style.display = isRegister ? "block" : "none";
        const input = el.querySelector(".f-password-confirm");
        if (input) {
          input.required = isRegister;
          if (!isRegister) input.value = "";
        }
      });
    }

    toggleBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        mode = mode === "login" ? "register" : "login";
        applyModeUI();
      });
    });

    forms.forEach(form => {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = form.querySelector(".js-error");
        const submitBtn = form.querySelector(".js-submit");
        const email = form.querySelector(".f-email").value.trim();
        const password = form.querySelector(".f-password").value;
        errorEl.textContent = "";

        if (mode === "register") {
          const confirmInput = form.querySelector(".f-password-confirm");
          const confirmPassword = confirmInput ? confirmInput.value : "";
          if (password !== confirmPassword) {
            errorEl.textContent = "Hai mật khẩu nhập lại không khớp nhau.";
            return;
          }
        }

        submitBtn.disabled = true;
        try {
          if (mode === "login") {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            await createUserProfile(cred.user.uid, { displayName: "", avatar: randomStamp() });
          }
          window.location.href = "index.html";
        } catch (err) {
          errorEl.textContent = friendlyError(err.code);
        } finally {
          submitBtn.disabled = false;
        }
      });
    });

    function friendlyError(code) {
      const map = {
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/user-not-found": "Không tìm thấy tài khoản này.",
        "auth/wrong-password": "Sai mật khẩu.",
        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
        "auth/email-already-in-use": "Email này đã được đăng ký.",
        "auth/weak-password": "Mật khẩu cần ít nhất 6 ký tự."
      };
      return map[code] || "Có lỗi xảy ra, thử lại nhé.";
    }
  </script>
</body>
</html>
