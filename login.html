<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Sổ Từ Vựng</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="airmail-rail"></div>
  <div class="auth-shell">

    <!-- ============ DESKTOP: mặt trước phong bì (kích thước như thư thật) ============ -->
    <div class="envelope-outer desktop-only">
      <div class="envelope-card">
        <svg class="flap-svg" viewBox="0 0 700 440" preserveAspectRatio="none">
          <line x1="0" y1="0" x2="700" y2="0"/>
          <line x1="0" y1="0" x2="350" y2="290"/>
          <line x1="700" y1="0" x2="350" y2="290"/>
        </svg>

        <div class="stamp-corner">
          <div class="stamp-icon">✉</div>
          <div class="stamp-text">PAR<br>AVION</div>
        </div>
        <div class="envelope-postmark">SỔ TỪ VỰNG</div>

        <div class="address-block">
          <div class="mode-label js-title">Đăng nhập</div>

          <div class="line">
            <span class="addr-label">Kính gửi</span>
            <span class="addr-value">Sổ Từ Vựng</span>
          </div>

          <form class="authForm">
            <div class="line from-line field">
              <label class="addr-label">Người gửi</label>
              <input type="email" class="f-email" placeholder="ten@email.com" required autocomplete="email">
            </div>
            <div class="field">
              <label>Mật khẩu</label>
              <input type="password" class="f-password" required autocomplete="current-password" minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block js-submit">Đăng nhập</button>
            <div class="error-msg js-error"></div>
          </form>

          <div class="auth-toggle">
            <span class="js-toggle-text">Chưa có tài khoản?</span>
            <button type="button" class="js-toggle-btn">Đăng ký</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ MOBILE: thẻ đơn giản ============ -->
    <div class="auth-card mobile-only">
      <h1 class="js-title">Đăng nhập</h1>
      <div class="sub">Sổ từ vựng của riêng bạn, đồng bộ ở mọi thiết bị.</div>

      <form class="authForm">
        <div class="field">
          <label>Email</label>
          <input type="email" class="f-email" required autocomplete="email">
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <input type="password" class="f-password" required autocomplete="current-password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block js-submit">Đăng nhập</button>
        <div class="error-msg js-error"></div>
      </form>

      <div class="auth-toggle">
        <span class="js-toggle-text">Chưa có tài khoản?</span>
        <button type="button" class="js-toggle-btn">Đăng ký</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword }
      from "./js/firebase-init.js";

    let mode = "login"; // hoặc "register"

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "index.html";
    });

    const forms = document.querySelectorAll(".authForm");
    const titles = document.querySelectorAll(".js-title");
    const submitBtns = document.querySelectorAll(".js-submit");
    const toggleTexts = document.querySelectorAll(".js-toggle-text");
    const toggleBtns = document.querySelectorAll(".js-toggle-btn");
    const errorEls = document.querySelectorAll(".js-error");

    function applyModeUI() {
      const isRegister = mode === "register";
      titles.forEach(el => el.textContent = isRegister ? "Tạo tài khoản" : "Đăng nhập");
      submitBtns.forEach(el => el.textContent = isRegister ? "Đăng ký" : "Đăng nhập");
      toggleTexts.forEach(el => el.textContent = isRegister ? "Đã có tài khoản?" : "Chưa có tài khoản?");
      toggleBtns.forEach(el => el.textContent = isRegister ? "Đăng nhập" : "Đăng ký");
      errorEls.forEach(el => el.textContent = "");
    }

    toggleBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        mode = mode === "login" ? "register" : "login";
        applyModeUI();
      });
    });

    forms.forEach(form => {
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = form.querySelector(".js-error");
        const submitBtn = form.querySelector(".js-submit");
        const email = form.querySelector(".f-email").value.trim();
        const password = form.querySelector(".f-password").value;
        errorEl.textContent = "";
        submitBtn.disabled = true;
        try {
          if (mode === "login") {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            await createUserWithEmailAndPassword(auth, email, password);
          }
          window.location.href = "index.html";
        } catch (err) {
          errorEl.textContent = friendlyError(err.code);
        } finally {
          submitBtn.disabled = false;
        }
      });
    });

    function friendlyError(code) {
      const map = {
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/user-not-found": "Không tìm thấy tài khoản này.",
        "auth/wrong-password": "Sai mật khẩu.",
        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
        "auth/email-already-in-use": "Email này đã được đăng ký.",
        "auth/weak-password": "Mật khẩu cần ít nhất 6 ký tự."
      };
      return map[code] || "Có lỗi xảy ra, thử lại nhé.";
    }
  </script>
</body>
</html>
