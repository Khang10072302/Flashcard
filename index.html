<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ từ vựng</title>
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div class="airmail-rail"></div>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="index.html">TỪ VỰNG</a>
      <a class="navlink active" href="index.html"><span class="ring">✉</span>Sổ từ</a>
      <a class="navlink" href="flashcards.html"><span class="ring">▤</span>Flashcard</a>
      <a class="navlink" href="writing.html"><span class="ring">✎</span>Luyện viết</a>
      <div class="spacer"></div>
      <a class="navlink logout" href="#" id="logoutBtn"><span class="ring">⇥</span>Thoát</a>
    </nav>

    <div class="main">
      <div class="topbar">
        <div>
          <h1>Sổ từ vựng</h1>
          <div class="sub" id="countLabel">Đang tải…</div>
        </div>
        <div class="postmark" id="dateStamp"></div>
      </div>

      <div class="content">
        <!-- ================= FORM THÊM TỪ ================= -->
        <section>
          <label for="pasteBox">Dán đoạn text copy từ Cambridge Dictionary (tùy chọn)</label>
          <textarea id="pasteBox" rows="6" placeholder="Vào dictionary.cambridge.org, mở trang từ bạn cần, bôi đen phần định nghĩa rồi copy-paste vào đây…"></textarea>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" id="parseBtn" type="button">Phân tích văn bản</button>
            <span class="hint" id="parseHint" style="align-self:center;">Kết quả bóc tách chỉ là gợi ý — kiểm tra lại trước khi lưu.</span>
          </div>

          <form id="wordForm">
            <div class="parse-preview">
              <div class="row">
                <div class="field">
                  <label for="fWord">Từ</label>
                  <input type="text" id="fWord" required>
                </div>
                <div class="field">
                  <label for="fIpaUK">IPA (UK)</label>
                  <input type="text" id="fIpaUK" placeholder="/wɜːd/">
                </div>
                <div class="field">
                  <label for="fIpaUS">IPA (US)</label>
                  <input type="text" id="fIpaUS" placeholder="/wɝːd/">
                </div>
              </div>

              <div id="sensesContainer"></div>

              <button type="button" class="btn" id="addSenseBtn" style="margin-top:6px;">+ Thêm loại từ / nghĩa</button>
            </div>

            <div style="margin-top:16px; display:flex; gap:10px;">
              <button type="submit" class="btn btn-primary">Lưu vào sổ từ</button>
              <button type="button" class="btn" id="clearFormBtn">Xóa form</button>
            </div>
          </form>
        </section>

        <hr style="border:none;border-top:1px solid var(--line); margin:34px 0;">

        <!-- ================= DANH SÁCH TỪ ================= -->
        <section id="wordList"></section>
      </div>
    </div>
  </div>

  <div id="toastHost"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
